[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-municode"
version = "0.1.0"
description = "MCP server for scraping telecommunications ordinances from Municode Library across all U.S. jurisdictions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "supabase>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
mcp-municode = "src.server:main"
